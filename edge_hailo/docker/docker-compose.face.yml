services:
  edge-hailo-face:
    build:
      context: ../..
      dockerfile: edge_hailo/docker/Dockerfile
      args:
        BASE_IMAGE: ${EDGE_HAILO_BASE_IMAGE:-python:3.11-slim}
        HAILORT_WHEEL: ${EDGE_HAILO_HAILORT_WHEEL:-edge_hailo/docker/no-hailort-wheel.txt}
    image: edge-hailo-face:latest
    restart: unless-stopped
    environment:
      EDGE_HAILO_DB_PATH: /app/edge_hailo/data/device_local.db
      EDGE_HAILO_ACCESS_CAMERA: /dev/video0
      EDGE_HAILO_SURVEILLANCE_CAMERA: /dev/video1
      EDGE_HAILO_REQUIRE_HAILORT: ${EDGE_HAILO_REQUIRE_HAILORT:-1}
    devices:
      - /dev/hailo0:/dev/hailo0
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
    volumes:
      - ../models:/app/edge_hailo/models
      - ../data:/app/edge_hailo/data
    ports:
      - "8080:8080"
