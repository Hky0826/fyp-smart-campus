services:
  access-control:
    build:
      context: ../../..
      dockerfile: access_control/facial_recognition/docker/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-python:3.11-slim}
    image: access-control:latest
    restart: unless-stopped
    environment:
      EDGE_DB_PATH: /app/access_control/facial_recognition/data/device_local.db
      EDGE_CAMERA: 0
      EDGE_ACCESS_CAMERA: 0
    devices:
      - /dev/video0:/dev/video0
    volumes:
      - ../models:/app/access_control/facial_recognition/models
      - ../data:/app/access_control/facial_recognition/data
    ports:
      - "8080:8080"
