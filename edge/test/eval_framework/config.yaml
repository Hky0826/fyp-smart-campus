# Configuration for Facial Recognition Evaluation Framework

# Random seed for reproducible sampling
random_seed: 42

# Batch size for embedding extraction
batch_size: 32

# Datasets configuration
datasets:
  lfw:
    name: "LFW"
    data_dir: "./data/lfw" # Where the LFW dataset is/will be downloaded
    pairs_file: "./data/lfw/pairs.txt"
    sample_size: 5000 # Sample around 5000 images worth of pairs
  cfp:
    name: "CFP"
    data_dir: "./data/cfp" # Where CFP will be downloaded
    protocol_dir: "./data/cfp/Protocol"
    sample_size: 5000 # Sample 5000 images

# Threshold parameters for Cosine Similarity
thresholds:
  start: 0.6
  end: 0.9
  step: 0.01

# FAR points for TAR interpolation
far_targets: [0.01, 0.001, 0.0001] # 1%, 0.1%, 0.01%
