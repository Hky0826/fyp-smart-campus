services:
  edge-face:
    build:
      context: ../..
      dockerfile: edge/docker/Dockerfile
      args:
        BASE_IMAGE: ${EDGE_BASE_IMAGE:-python:3.11-slim}
        HAILORT_WHEEL: ${EDGE_HAILORT_WHEEL:-edge/docker/no-hailort-wheel.txt}
    image: edge-face:latest
    restart: unless-stopped
    environment:
      EDGE_DB_PATH: /app/edge/data/device_local.db
      EDGE_CAMERA: /dev/video4
      EDGE_ACCESS_CAMERA: /dev/video4
      EDGE_SURVEILLANCE_CAMERA: /dev/video4
      EDGE_REQUIRE_HAILORT: ${EDGE_REQUIRE_HAILORT:-1}
    devices:
      - /dev/hailo0:/dev/hailo0
      - /dev/video4:/dev/video4
    volumes:
      - ../models:/app/edge/models
      - ../data:/app/edge/data
    ports:
      - "8080:8080"
